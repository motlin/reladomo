name: Test Suite 6

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    if: github.repository == 'goldmansachs/reladomo'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 1.8
      uses: actions/setup-java@v4
      with:
        java-version: 8
        distribution: temurin
        cache: maven
    - name: Build and test with Maven
      run: mvn install -P suite6 -pl reladomo-test-offheap -am
